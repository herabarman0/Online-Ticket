<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}লাকি মেলা{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Galada&family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app">
{% block shell %}
  <div class="bar"><a class="brand" href="{{ url_for('home') }}">লাকি মেলা</a><div class="chip"><span class="coin">৳</span><b id="pts">{{ u.points|bn }}</b></div></div>
  <div class="scroll">
    {% for m in get_flashed_messages() %}<div class="fl" role="status">{{ m }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </div>
  <nav class="tabs" aria-label="মেনু">
    <a href="{{ url_for('home') }}" class="{{ 'on' if request.endpoint=='home' }}"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>হোম</a>
    <a href="{{ url_for('board') }}" class="{{ 'on' if request.endpoint=='board' }}"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>লিডারবোর্ড</a>
    <a href="{{ url_for('ticket') }}" class="mid {{ 'on' if request.endpoint in ('ticket','buy') }}"><span class="o"><svg viewBox="0 0 24 24"><path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"/></svg></span>টিকিট</a>
    <a href="{{ url_for('winners') }}" class="{{ 'on' if request.endpoint=='winners' }}"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="5"/><path d="M9 13.5L7 21l5-3 5 3-2-7.5"/></svg>বিজয়ী</a>
    <a href="{{ url_for('profile') }}" class="{{ 'on' if request.endpoint=='profile' }}"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>প্রোফাইল</a>
  </nav>
{% endblock %}
</div>
</body>
</html>
