{% extends "base.html" %}
{% block content %}
<h2>পুরস্কার দাবি</h2><p class="sub">{{ r.title }} · টিকিট #{{ r.winner_num|pad4 }} · {{ r.prize|m }} পয়েন্ট</p>
<form class="f" method="post" id="cf" novalidate>
  <label for="n">পুরো নাম</label><input id="n" name="name" required maxlength="60" value="{{ f.get('name','') }}" autocomplete="name">
  <label for="ph">মোবাইল নম্বর</label><input id="ph" name="phone" required inputmode="tel" placeholder="০১৭XXXXXXXX" value="{{ f.get('phone','') }}" autocomplete="tel">
  <label for="ad">পুরো ঠিকানা</label><input id="ad" name="address" required maxlength="200" value="{{ f.get('address','') }}" autocomplete="street-address">
  <label for="ag">বয়স</label><input id="ag" name="age" required inputmode="numeric" value="{{ f.get('age','') }}">
  <label for="fb">ফেসবুক প্রোফাইল লিংক</label><input id="fb" name="fb" required placeholder="facebook.com/আপনার-আইডি" value="{{ f.get('fb','') }}">
  <label for="ok" style="display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:14px 0;cursor:pointer"><input type="checkbox" id="ok" name="ok" value="1" style="width:24px;height:24px;flex:none;margin:2px 0 0">আমি সম্মতি দিচ্ছি, পুরস্কার পাঠাতে ও যোগাযোগের জন্য এই তথ্য ব্যবহার করা হবে।</label>
  {% if err %}<div id="er" role="alert" style="background:#FFE3EA;color:#B0123A;border:2px solid #FF2E7E;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:700">{{ err }}</div>{% endif %}
  <button class="btn" id="sb" disabled>তথ্য জমা দিন</button>
  <p class="sub" id="hint" style="text-align:center;margin-top:8px">জমা দিতে আগে সম্মতি বক্সে টিক দিন।</p>
</form>
<script>
var ok=document.getElementById("ok"),sb=document.getElementById("sb"),h=document.getElementById("hint");
function sync(){sb.disabled=!ok.checked;h.style.display=ok.checked?"none":"block"}
ok.onchange=sync;sync();
document.getElementById("cf").onsubmit=function(e){if(!ok.checked){e.preventDefault();return}sb.disabled=true;sb.textContent="জমা হচ্ছে…"};
var er=document.getElementById("er");if(er)er.scrollIntoView({block:"center"});
</script>
{% endblock %}
